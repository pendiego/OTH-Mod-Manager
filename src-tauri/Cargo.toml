[package]
name = "oth-mod-manager"
version = "0.1.0"
description = "Mod manager for over the hill"
authors = ["pendiego"]
edition = "2021"

[lib]
name = "oth_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "query"] }
tokio = { version = "1", features = ["sync", "time"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.23"
unrar = "0.5"
regex = "1"
dirs = "7"
walkdir = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
